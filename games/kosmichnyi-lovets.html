<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<title>Космічний ловець</title>
<style>
:root{--card:#FFFDF7;--ink:#1F2A5C;--muted:#4F5A8A;--sun:#FFC93C;--coral:#FF6B8B;--mint:#27C9A0;--sky:#4CB5F5;--lilac:#9C88FF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1F2756;--ink:#FFF4D6;--muted:#B9C0EA;color-scheme:dark}}
:root[data-theme="dark"]{--card:#1F2756;--ink:#FFF4D6;--muted:#B9C0EA;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#0B0A2E;font-family:"Trebuchet MS","Comic Sans MS","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#17144F;border-bottom:4px solid #2D2A7A;flex-wrap:wrap}
.pill{background:#fff;color:#1F2A5C;border:3px solid #1F2A5C;border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(1rem,2.2vw,1.5rem);white-space:nowrap}
.grow{flex:1;min-width:140px;color:#fff;font-weight:800}
#bar{height:18px;background:#2D2A7A;border:3px solid #fff;border-radius:99px;overflow:hidden}
#barf{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC93C,#FF6B8B);transition:width .25s}
.ib{width:56px;height:56px;border-radius:16px;border:3px solid #1F2A5C;background:var(--sun);font-size:1.6rem;cursor:pointer;box-shadow:0 4px 0 #1F2A5C}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #1F2A5C}
#stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,40,.78);padding:16px;overflow:auto}
.ov.on{display:flex}
.card{background:var(--card);color:var(--ink);border:5px solid #1F2A5C;border-radius:32px;box-shadow:0 8px 0 #1F2A5C;padding:clamp(16px,3vw,34px);max-width:720px;width:100%;text-align:center}
.card h1,.card h2{margin:0 0 8px;font-size:clamp(1.8rem,5vw,3.2rem);line-height:1.1}
.card p{margin:8px 0;font-size:clamp(1.05rem,2.2vw,1.5rem);font-weight:700;color:var(--muted)}
.rocket{font-size:clamp(3rem,9vw,5.5rem);display:inline-block;animation:fl 2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(6deg)}}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.btn{font:inherit;font-weight:800;font-size:clamp(1.1rem,2.4vw,1.7rem);border:4px solid #1F2A5C;border-radius:20px;padding:12px 26px;min-height:60px;background:var(--coral);color:#fff;cursor:pointer;box-shadow:0 6px 0 #1F2A5C}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1F2A5C}
.btn.alt{background:#fff;color:#1F2A5C}
.dif{background:#fff;color:#1F2A5C}
.dif[aria-pressed="true"]{background:var(--mint);color:#10304A;outline:4px solid var(--sun)}
.stat{font-size:clamp(1.3rem,3vw,2rem);font-weight:800;margin:6px 0}
.big{font-size:clamp(3rem,10vw,6rem);line-height:1}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.rocket{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pill">⭐ <span id="sc">0</span></div>
    <div class="pill">🚀 Рівень <span id="lv">1</span></div>
    <div class="pill" id="lives" aria-label="Життя"></div>
    <div class="grow"><div id="bar"><i id="barf"></i></div><span id="bt">0 / 10</span></div>
    <button class="ib" id="bp" type="button" aria-label="Пауза">⏸</button>
    <button class="ib" id="bs" type="button" aria-label="Звук">🔊</button>
    <button class="ib" id="bf" type="button" aria-label="На весь екран">⛶</button>
  </div>
  <div id="stage">
    <canvas id="c" aria-label="Ігрове поле"></canvas>

    <div class="ov on" id="menu"><div class="card">
      <div class="rocket" aria-hidden="true">🚀</div>
      <h1>Космічний ловець</h1>
      <p>Рухай мишку — і керуй кошиком-кораблем.<br>Лови ⭐ та 🪐, обминай ☄️!</p>
      <p>Кожні 10 балів — новий рівень.</p>
      <div class="row" role="group" aria-label="Складність">
        <button class="btn dif" data-d="easy" type="button" aria-pressed="false">🐢 Легко</button>
        <button class="btn dif" data-d="mid" type="button" aria-pressed="true">🚀 Середньо</button>
        <button class="btn dif" data-d="hard" type="button" aria-pressed="false">☄️ Важко</button>
      </div>
      <div class="row"><button class="btn" id="go" type="button">▶ Старт!</button></div>
      <p style="font-size:1rem">Ще можна керувати стрілками ← →. Пауза — клавіша P.</p>
    </div></div>

    <div class="ov" id="pause"><div class="card">
      <h2>⏸ Пауза</h2><p>Відпочинь і повертайся до зірок!</p>
      <div class="row"><button class="btn" id="rs" type="button">▶ Продовжити</button><button class="btn alt" id="rp" type="button">🔄 Спочатку</button><button class="btn alt" id="mm" type="button">🏠 Меню</button></div>
    </div></div>

    <div class="ov" id="lvup"><div class="card">
      <div class="big" aria-hidden="true">🎉</div>
      <h2 id="lt">Рівень 2!</h2>
      <p id="tip"></p>
      <div class="row"><button class="btn" id="nx" type="button">Далі ▶</button></div>
    </div></div>

    <div class="ov" id="end"><div class="card">
      <div class="big" id="em" aria-hidden="true">🏆</div>
      <h2 id="et">Гру закінчено</h2>
      <div class="stat" id="es1"></div><div class="stat" id="es2"></div><p id="es3"></p>
      <div class="row"><button class="btn" id="ag" type="button">🔄 Грати ще</button><button class="btn alt" id="mm2" type="button">🏠 Меню</button></div>
    </div></div>
  </div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)},cv=$("c"),x=cv.getContext("2d"),W=800,H=500,S=1,D=1;
var DIFF={easy:{n:"Легко",lives:5,sp:.2,sw:1.15,met:.15},mid:{n:"Середньо",lives:3,sp:.27,sw:.95,met:.24},hard:{n:"Важко",lives:3,sp:.35,sw:.75,met:.3}};
var MAXL=8,GOAL=10;
var TIPS=["Мишка — пристрій введення: вона передає команди комп’ютеру.","Цикл — це коли дію повторюють. Як ловити зірки в цій грі!","Пароль — секрет. Не показуй його нікому, крім батьків.","Файли зберігають у папках, щоб їх легко було знайти.","Алгоритм — це кроки, які виконують по порядку.","Ctrl + C копіює, а Ctrl + V вставляє.","Роби перерви під час роботи за екраном — бережи очі.","Монітор виводить зображення, а клавіатура вводить текст."];
var st="menu",df="mid",score=0,lvl=1,got=0,lives=3,stars=0,obj=[],fx=[],t=0,sp=0,last=0,px=400,tx=400,hit=0,shake=0,sound=true,kx=0,AC=null;
var BG=[],PL=[];
for(var i=0;i<90;i++)BG.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,s:Math.random()*.6+.2,p:Math.random()*6});
PL=[{x:.12,y:.28,r:.07,a:"#FF9F6B",b:"#C2410C",ring:0},{x:.78,y:.18,r:.09,a:"#7DD3FC",b:"#1D4ED8",ring:1},{x:.55,y:.62,r:.045,a:"#C4B5FD",b:"#6D28D9",ring:0}];

/* звук */
function beep(f,d,ty,v,sl,dl){if(!sound||!AC)return;var o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+(dl||0);o.type=ty||"sine";o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t0+d);g.gain.setValueAtTime(v||.12,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03)}
function snd(k){if(k=="c"){beep(660,.09,"sine",.14);beep(990,.12,"sine",.14,0,.07)}
 else if(k=="p")[523,659,784,1047].forEach(function(f,i){beep(f,.14,"triangle",.15,0,i*.07)});
 else if(k=="h")beep(300,.3,"sawtooth",.13,-220);
 else if(k=="l")[523,659,784,1047,1319].forEach(function(f,i){beep(f,.2,"square",.07,0,i*.1)});
 else if(k=="o")[392,330,262,196].forEach(function(f,i){beep(f,.25,"triangle",.14,0,i*.18)});
 else beep(880,.06,"sine",.08)}

/* стани та екрани */
function ov(id){["menu","pause","lvup","end"].forEach(function(k){$(k).classList.toggle("on",k==id)})}
function setSt(s){st=s;$("stage").style.cursor=s=="play"?"none":"default"}
function hud(){$("sc").textContent=score;$("lv").textContent=lvl;$("barf").style.width=Math.min(100,got/GOAL*100)+"%";$("bt").textContent=Math.min(got,GOAL)+" / "+GOAL;
 var m=DIFF[df].lives;$("lives").textContent=Array(lives+1).join("❤️")+Array(Math.max(0,m-lives)+1).join("🖤")}
function reset(){score=0;lvl=1;got=0;stars=0;obj=[];fx=[];lives=DIFF[df].lives;hit=0;shake=0;sp=.6;hud()}
function start(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume()}catch(e){}
 reset();ov(null);setSt("play");snd("u")}
function pause(){if(st=="play"){setSt("pause");ov("pause")}}
function resume(){if(st=="pause"){setSt("play");ov(null)}}
function toMenu(){setSt("menu");reset();ov("menu")}
function finish(win){setSt("over");snd(win?"l":"o");
 $("em").textContent=win?"🥇":lvl>=5?"🥈":lvl>=3?"🥉":"🌟";
 $("et").textContent=win?"Місія виконана! 🏆":"Гру закінчено";
 $("es1").textContent="⭐ Балів: "+score+" · 🚀 Рівень: "+lvl+" з "+MAXL;
 $("es2").textContent="Складність: "+DIFF[df].n;
 $("es3").textContent=win?"Ти справжній космічний ловець!":lvl>=3?"Чудовий політ! Спробуй дійти до кінця.":"Гарний початок! Спробуй ще раз.";
 ov("end")}
function levelUp(){obj=[];setSt("lvup");snd("l");$("lt").textContent="Рівень "+(lvl+1)+"!";$("tip").textContent="💡 "+TIPS[lvl%TIPS.length];ov("lvup")}
function next(){lvl++;got=0;sp=.6;hud();ov(null);setSt("play")}

/* гра */
function spawn(){var d=DIFF[df],mc=Math.min(.5,d.met+.02*(lvl-1)),r=Math.random(),
 k=r<mc?"m":r<mc+.07?"p":(r<mc+.1&&lives<d.lives)?"h":"s",
 z=(k=="p"?30:k=="m"?26:22)*S,v=d.sp*H*(1+.1*(lvl-1))*(.8+Math.random()*.4);
 obj.push({k:k,x:z+Math.random()*(W-2*z),y:-z,v:v,vx:(lvl>2&&Math.random()<.5)?(Math.random()-.5)*20*S*lvl:0,r:z,w:Math.random()*6})}
function burst(a,b,c){for(var i=0;i<10;i++)fx.push({x:a,y:b,vx:(Math.random()-.5)*260*S,vy:(Math.random()-.5)*260*S,l:.6,c:c})}
function pop(a,b,tx2){fx.push({x:a,y:b,vy:-70*S,l:.9,t:tx2})}
function take(o){
 if(o.k=="m"){lives--;hit=1;shake=.5;snd("h");burst(o.x,o.y,"#FF5A5A");pop(o.x,o.y-20*S,"−❤️");hud();if(lives<=0)finish(false);return}
 var p=o.k=="p"?2:1;if(o.k=="h"){lives=Math.min(DIFF[df].lives,lives+1);pop(o.x,o.y-20*S,"+❤️");snd("c")}
 else{score+=p;got+=p;stars++;pop(o.x,o.y-20*S,"+"+p);snd(o.k=="p"?"p":"c")}
 burst(o.x,o.y,o.k=="h"?"#FF6B8B":"#FFC93C");hud();
 if(got>=GOAL){if(lvl>=MAXL)finish(true);else levelUp()}}
function update(dt){
 if(kx)tx=Math.max(0,Math.min(W,tx+kx*W*.9*dt));
 px+=(tx-px)*Math.min(1,dt*14);hit=Math.max(0,hit-dt);shake=Math.max(0,shake-dt*3);
 sp-=dt;if(sp<=0){spawn();sp=Math.max(.28,DIFF[df].sw*Math.pow(.9,lvl-1))*(.75+Math.random()*.5)}
 var w=84*S,h=58*S,cy=H-h*.9;
 for(var i=obj.length-1;i>=0;i--){var o=obj[i];o.y+=o.v*dt;o.x+=o.vx*dt;if(o.x<o.r||o.x>W-o.r)o.vx=-o.vx;
  if(Math.abs(o.x-px)<w*.58&&o.y>cy-h*.6&&o.y<cy+h*.05){obj.splice(i,1);take(o);if(st!="play")return;continue}
  if(o.y>H+60)obj.splice(i,1)}}

/* малювання */
function planet(p){var cx=p.x*W,cy=p.y*H,r=p.r*Math.min(W,H)*1.4,g=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,p.a);g.addColorStop(1,p.b);
 if(p.ring){x.strokeStyle="rgba(255,255,255,.55)";x.lineWidth=r*.14;x.beginPath();x.ellipse(cx,cy,r*1.7,r*.45,-.35,0,7);x.stroke()}
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
function bg(dt){var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0B0A2E");g.addColorStop(1,"#3B1D73");x.fillStyle=g;x.fillRect(0,0,W,H);
 BG.forEach(function(s){s.y=(s.y+s.s*dt*.03)%1;x.globalAlpha=.5+.5*Math.sin(t*2+s.p);x.fillStyle="#fff";x.beginPath();x.arc(s.x*W,s.y*H,s.r*S,0,7);x.fill()});x.globalAlpha=1;
 PL.forEach(function(p){p.x=(p.x+dt*.004)%1.2;planet(p)})}
function ship(){var w=84*S,h=58*S;x.save();x.translate(px,H-h*.9);if(hit>0&&Math.floor(hit*12)%2)x.globalAlpha=.4;
 x.lineWidth=3*S;x.strokeStyle="#1F2A5C";x.lineJoin="round";
 var f=10*S+Math.sin(t*30)*4*S;x.fillStyle="#FFB703";[-1,1].forEach(function(s){x.beginPath();x.moveTo(s*w*.22-7*S,h*.35);x.lineTo(s*w*.22,h*.35+f+8*S);x.lineTo(s*w*.22+7*S,h*.35);x.fill()});
 var g=x.createLinearGradient(0,-h*.4,0,h*.4);g.addColorStop(0,"#FF8FAB");g.addColorStop(1,"#E0446E");x.fillStyle=g;
 x.beginPath();x.moveTo(-w/2,-h*.35);x.lineTo(w/2,-h*.35);x.lineTo(w*.34,h*.35);x.lineTo(-w*.34,h*.35);x.closePath();x.fill();x.stroke();
 x.fillStyle="#1B1646";x.beginPath();x.ellipse(0,-h*.35,w/2,7*S,0,0,7);x.fill();x.stroke();
 x.fillStyle="#FFC93C";x.beginPath();x.moveTo(-w*.1,-h*.4);x.lineTo(0,-h*.95);x.lineTo(w*.1,-h*.4);x.fill();x.stroke();
 [-1,1].forEach(function(s){x.fillStyle="#fff";x.beginPath();x.arc(s*w*.15,-h*.02,7.5*S,0,7);x.fill();x.stroke();x.fillStyle="#1F2A5C";x.beginPath();x.arc(s*w*.15+s*1.5*S,0,3.5*S,0,7);x.fill()});
 x.beginPath();x.arc(0,h*.05,10*S,.15*Math.PI,.85*Math.PI);x.stroke();x.restore()}
var EM={s:"⭐",p:"🪐",m:"☄️",h:"❤️"};
function items(){x.textAlign="center";x.textBaseline="middle";
 obj.forEach(function(o){var r=o.r*(o.k=="s"?1+.08*Math.sin(t*6+o.w):1);
  if(o.k=="m"){x.fillStyle="rgba(255,60,60,.28)";x.beginPath();x.arc(o.x,o.y,r*1.25,0,7);x.fill()}
  else{x.fillStyle=o.k=="s"?"rgba(255,220,80,.25)":"rgba(255,255,255,.15)";x.beginPath();x.arc(o.x,o.y,r*1.2,0,7);x.fill()}
  x.font=(r*2)+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";x.fillStyle="#fff";x.fillText(EM[o.k],o.x,o.y)})}
function effects(dt){for(var i=fx.length-1;i>=0;i--){var f=fx[i];f.l-=dt;if(f.l<=0){fx.splice(i,1);continue}
  f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;x.globalAlpha=Math.min(1,f.l*2);
  if(f.t){x.font="800 "+26*S+"px 'Trebuchet MS',sans-serif";x.textAlign="center";x.lineWidth=5;x.strokeStyle="#1F2A5C";x.strokeText(f.t,f.x,f.y);x.fillStyle="#FFE066";x.fillText(f.t,f.x,f.y)}
  else{x.fillStyle=f.c;x.beginPath();x.arc(f.x,f.y,4*S,0,7);x.fill()}}x.globalAlpha=1}
function draw(dt){x.save();if(shake>0)x.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);bg(dt);items();ship();effects(dt);x.restore()}
function frame(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;if(st=="play")update(dt);draw(dt);requestAnimationFrame(frame)}

/* розмір */
function fit(){var r=cv.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(240,r.height);D=Math.min(2,window.devicePixelRatio||1);
 cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);S=Math.max(.75,Math.min(1.9,Math.min(W,H)/560));px=Math.min(px,W);tx=Math.min(tx,W)}

/* керування */
function mv(e){var r=cv.getBoundingClientRect();tx=e.clientX-r.left}
cv.addEventListener("pointermove",mv);cv.addEventListener("pointerdown",mv);
document.addEventListener("keydown",function(e){var k=e.key;
 if(k=="ArrowLeft"||k=="a"||k=="A"){kx=-1;e.preventDefault()}
 else if(k=="ArrowRight"||k=="d"||k=="D"){kx=1;e.preventDefault()}
 else if(k=="p"||k=="P"||k=="Escape"||k=="з"||k=="З"){if(st=="play")pause();else if(st=="pause")resume()}
 else if(k=="m"||k=="M"||k=="ь"||k=="Ь")tglSound()
 else if(k=="Enter"&&st=="menu")start()});
document.addEventListener("keyup",function(e){var k=e.key;if(k=="ArrowLeft"||k=="ArrowRight"||k=="a"||k=="d"||k=="A"||k=="D")kx=0});
document.addEventListener("visibilitychange",function(){if(document.hidden)pause()});
window.addEventListener("resize",fit);
function tglSound(){sound=!sound;$("bs").textContent=sound?"🔊":"🔇";$("bs").setAttribute("aria-label",sound?"Вимкнути звук":"Увімкнути звук")}
$("bs").onclick=tglSound;
$("bp").onclick=function(){if(st=="play")pause();else if(st=="pause")resume()};
$("bf").onclick=function(){var d=document,e=d.documentElement;if(d.fullscreenElement){d.exitFullscreen()}else if(e.requestFullscreen){var p=e.requestFullscreen();if(p&&p.catch)p.catch(function(){})}};
$("go").onclick=start;$("ag").onclick=start;$("rs").onclick=resume;$("rp").onclick=start;$("mm").onclick=toMenu;$("mm2").onclick=toMenu;$("nx").onclick=next;
[].forEach.call(document.querySelectorAll(".dif"),function(b){b.onclick=function(){df=b.dataset.d;[].forEach.call(document.querySelectorAll(".dif"),function(y){y.setAttribute("aria-pressed",y==b)});reset();snd("u")}});

fit();px=tx=W/2;reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
