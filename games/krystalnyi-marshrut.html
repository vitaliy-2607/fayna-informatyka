<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Кристальний маршрут</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: desktop/landscape tablet = blocks | program | stage (scene, brief, run controls);
   portrait tablet = scene on top, blocks | program below; phone = single column.
   Single deliberate dark "mission console" look. */
:root{
  --space:#0a0c19; --panel:#12162b; --panel2:#191e3a; --ws:#161b34; --line:#29305a;
  --ink:#eef1ff; --mute:#a2abd0; --accent:#ff4fc3; --mint:#4ff0c8; --warn:#ff6b6b;
  --b-move:#3f86f5; --b-move-d:#2c66c4; --b-ctrl:#f0a020; --b-ctrl-d:#c47f0e;
  --b-fn:#d9418a; --b-fn-d:#a92d69; --b-hat:#f2b230; --b-hat-d:#c58b14;
  --display:"Unbounded","Arial Black",sans-serif;
  --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

.top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:15px;white-space:nowrap}
.brand i{font-style:normal;color:var(--mint)}
.planets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.planets::-webkit-scrollbar{display:none}
.ptab{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;
  padding:6px 12px 6px 7px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--mute)}
.ptab .orb{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:inset -4px -3px 0 rgba(0,0,0,.35)}
.ptab[aria-current="true"]{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--panel2))}
.ptab .ok{color:var(--mint);font-size:12px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel2);flex:none}
.lang button{border:0;background:none;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--mute);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--space)}
.lvwrap{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 360px}
.lvlabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.levels{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;min-width:0;padding-block:2px}
.lv{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px;cursor:pointer;color:var(--mute);font-variant-numeric:tabular-nums}
.lv.done{color:var(--mint);border-color:color-mix(in srgb,var(--mint) 55%,var(--line))}
.lv.locked{color:color-mix(in srgb,var(--mute) 60%,transparent);background:transparent;border-style:dashed;cursor:not-allowed;display:inline-grid;place-items:center}
.ptab.locked{opacity:.55;cursor:not-allowed}
.ptab .lock{display:inline-grid;place-items:center;color:var(--mute)}
.lv[aria-current="true"]{background:var(--ink);color:var(--space);border-color:var(--ink)}

.layout{flex:1;min-height:0;display:grid;gap:0;
  grid-template-areas:"view" "brief" "pal" "ws" "run";
  grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(200px,34vh) auto auto minmax(0,1fr) auto}
.viewport{grid-area:view;position:relative;min-height:0;background:#000}
.brief{grid-area:brief}
.palcol{grid-area:pal;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel2);border-block:1px solid var(--line)}
.wscol{grid-area:ws;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--ws)}
.runbar{grid-area:run}

#three{position:absolute;inset:0}
#three canvas{display:block;touch-action:none}
.viewport::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 42%,transparent 58%,rgba(0,0,0,.42));z-index:1}
.vchip,.gems,.toast,.veil{z-index:2}
.veil{position:absolute;inset:0;display:grid;place-items:center;background:var(--space);color:var(--mute);font-size:14px;letter-spacing:.04em}
.vchip{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));pointer-events:none;max-width:calc(100% - 120px)}
.vchip span{display:inline-block;background:rgba(8,10,22,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.gems{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));background:rgba(8,10,22,.72);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.gems b{color:var(--mint)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(460px,calc(100% - 32px));
  background:rgba(12,14,30,.94);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-size:14.5px;line-height:1.4;text-align:center}
.toast.good{border-color:var(--mint)}

.brief{background:var(--panel);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.brief h2{margin:0;font-family:var(--display);font-size:16px;font-weight:600;text-wrap:balance}
.brief h2 small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.brief p{margin:0;font-size:14px;line-height:1.45;color:var(--mute);max-width:65ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.full{border-color:var(--warn);color:var(--warn)}

.colhead{display:flex;align-items:baseline;gap:8px;padding:8px 14px 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.colhead span{font-weight:400;letter-spacing:0;text-transform:none;font-size:12.5px;opacity:.8}
.palette{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding:8px 14px 14px;scrollbar-width:thin}
.palette .blk{touch-action:pan-x;cursor:grab;flex:none}
.palette .blk.off{opacity:.35;cursor:not-allowed}
.palette .badge{position:absolute;top:-7px;right:-6px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;z-index:3;letter-spacing:.02em}
.workspace{flex:1;min-height:0;overflow:auto;position:relative;background-color:var(--ws);
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px;padding:2px 8px 24px}
.stack{display:flex;flex-direction:column;align-items:flex-start;padding:10px 6px 16px}
.list{display:flex;flex-direction:column;align-items:flex-start}
.wsnote{font-size:13px;color:var(--mute);padding:0 8px 8px;max-width:40ch}

.runbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.go{background:var(--mint);color:#04241c;border-color:transparent;flex:1 1 150px;max-width:260px;font-size:15px}
.btn.go.stop{background:var(--warn);color:#2a0606}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Portrait tablet: scene on top, blocks | program below */
@media (min-width:700px){
  .layout{grid-template-areas:"view view" "brief brief" "pal ws" "run run";grid-template-columns:240px minmax(0,1fr);grid-template-rows:minmax(260px,40vh) auto minmax(0,1fr) auto}
  .palcol{border-block:0;border-right:1px solid var(--line)}
  .palette{flex-direction:column;overflow-x:visible;overflow-y:auto;flex:1;min-height:0;gap:12px;padding:10px 14px 18px}
  .palette .blk{touch-action:pan-y}
}
/* Computer and landscape tablet: blocks | program | stage */
@media (min-width:1000px) and (orientation:landscape){
  .layout{grid-template-areas:"pal ws view" "pal ws brief" "pal ws run";grid-template-columns:240px minmax(300px,.85fr) minmax(420px,1.35fr);grid-template-rows:minmax(0,1fr) auto auto}
  .viewport{border-left:1px solid var(--line)}
  .brief,.runbar{border-left:1px solid var(--line)}
  .wscol{border-right:0}
}
@media (min-width:1400px) and (orientation:landscape){
  .layout{grid-template-columns:260px minmax(340px,.85fr) minmax(560px,1.5fr)}
}
@media (prefers-reduced-motion:reduce){.ghost{transform:none}}

/* ---- Blocks ---- */
.blk{--c:var(--b-move);--cd:var(--b-move-d);position:relative;display:flex;align-items:center;gap:8px;min-height:40px;min-width:132px;width:max-content;
  padding:8px 12px;border-radius:7px;background:var(--c);color:#fff;font-weight:600;font-size:15px;user-select:none;-webkit-user-select:none;
  box-shadow:inset 0 -3px 0 var(--cd);cursor:pointer}
.blk::before{content:"";position:absolute;top:0;left:16px;width:24px;height:6px;background:var(--ws);
  clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);z-index:1}
.blk::after{content:"";position:absolute;bottom:-6px;left:16px;width:24px;height:6px;background:var(--cd);
  clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);z-index:2}
.palette .blk::before{background:var(--panel2)}
.blk .ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.18);font-size:16px;line-height:1}
.blk.ctrl{--c:var(--b-ctrl);--cd:var(--b-ctrl-d)}
.blk.fn{--c:var(--b-fn);--cd:var(--b-fn-d)}
.blk.hat{--c:var(--b-hat);--cd:var(--b-hat-d);border-radius:20px 20px 7px 7px / 16px 16px 7px 7px;padding-top:12px;min-width:170px;color:#2b1a00}
.blk.hat::before{display:none}
.blk.hat.hat-fn{--c:var(--b-fn);--cd:var(--b-fn-d);color:#fff}
.blk.hat .flag{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1f9d55;color:#fff;font-size:12px}

/* C-shaped repeat block */
.blk.rep{display:block;padding:0;background:none;box-shadow:none;min-width:0}
.blk.rep::after{display:none}
.chead{position:relative;display:flex;align-items:center;gap:7px;padding:8px 12px;min-height:40px;background:var(--c);border-radius:7px 7px 7px 0;box-shadow:inset 0 -3px 0 var(--cd);min-width:180px}
.chead::after{content:"";position:absolute;bottom:-6px;left:32px;width:24px;height:6px;background:var(--cd);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);z-index:2}
.cbody{border-left:16px solid var(--c);padding:6px 0 4px;min-height:24px}
.cfoot{position:relative;height:20px;background:var(--c);border-radius:0 7px 7px 7px;box-shadow:inset 0 -3px 0 var(--cd);min-width:120px}
.cfoot::after{content:"";position:absolute;bottom:-6px;left:16px;width:24px;height:6px;background:var(--cd);clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);z-index:2}
.num{display:inline-flex;align-items:center;gap:2px;background:#fff;color:#3b2a00;border-radius:999px;padding:1px 2px;font-variant-numeric:tabular-nums}
.num b{min-width:22px;text-align:center;font-size:15px}
.num button{width:26px;height:26px;border:0;border-radius:50%;background:rgba(0,0,0,.08);font-size:16px;font-weight:700;cursor:pointer;color:#3b2a00}
.palette .num button{display:none}

.slot{position:relative;height:0;width:140px}
.slot.cursor::after,.slot.drop::after{content:"";position:absolute;left:4px;top:-2px;width:150px;height:5px;border-radius:3px;background:var(--mint);box-shadow:0 0 10px var(--mint);z-index:4}
.slot.drop::after{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.slot.empty{height:30px;width:150px;margin:2px 0 4px;border:1.5px dashed rgba(255,255,255,.28);border-radius:6px;display:flex;align-items:center;padding-left:10px;font-size:12px;color:var(--mute);cursor:pointer}
.slot.empty.cursor,.slot.empty.drop{border-color:var(--mint);color:var(--mint)}
.slot.empty.drop{border-color:var(--accent);color:var(--accent)}
.slot.empty::after{display:none}

.blk.sel>.chead,.blk.sel:not(.rep){outline:2px dashed #fff;outline-offset:2px}
.blk.run:not(.rep),.blk.run>.chead,.blk.run>.cfoot{box-shadow:inset 0 -3px 0 var(--cd),0 0 0 3px #fff,0 0 16px 4px var(--c)}
.blk.err:not(.rep),.blk.err>.chead{box-shadow:inset 0 -3px 0 var(--cd),0 0 0 3px var(--warn),0 0 16px 4px var(--warn)}
.tools{display:inline-flex;gap:4px;margin-left:6px}
.tools button,.tools .grip{width:30px;height:28px;border:0;border-radius:6px;background:rgba(0,0,0,.25);color:#fff;font-size:14px;cursor:pointer;display:inline-grid;place-items:center}
.tools .grip{cursor:grab;touch-action:none}
.dragging{opacity:.3}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;transform:rotate(-2deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.ghost::before{display:none}

.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(4,5,12,.6);padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.card h3{margin:0;font-family:var(--display);font-size:20px}
.card p{margin:0;color:var(--mute);line-height:1.5}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.burst{font-size:34px;color:var(--mint)}
.fact{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fact-k{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mint)}
.fact-k .orb{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset -3px -2px 0 rgba(0,0,0,.35)}
.card .fact p{color:var(--ink);font-size:14.5px;line-height:1.5}


/* ---- Splash (loading) screen ---- */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 90% at 50% 30%,#1b1f4a 0%,#0a0c19 60%,#05060d 100%);transition:opacity .5s ease,visibility .5s}
.splash.gone{opacity:0;visibility:hidden}
.splash::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#cfe0ff,transparent),radial-gradient(1.4px 1.4px at 86% 64%,#fff,transparent),
  radial-gradient(1px 1px at 30% 78%,#bcd,transparent),radial-gradient(1.2px 1.2px at 52% 44%,#fff,transparent),radial-gradient(1px 1px at 8% 60%,#dfe8ff,transparent),
  radial-gradient(1px 1px at 92% 30%,#fff,transparent),radial-gradient(1.3px 1.3px at 40% 8%,#fff,transparent),radial-gradient(1px 1px at 64% 88%,#cfe,transparent)}
.sp-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;width:min(520px,100%);text-align:center}
.sp-lang{position:absolute;top:0;right:0}
.orbits{position:relative;width:220px;height:220px;margin-top:28px}
.orbit{position:absolute;inset:var(--i);border:1px solid rgba(160,180,255,.18);border-radius:50%;animation:spin var(--d) linear infinite}
.orbit b{position:absolute;top:-7px;left:50%;width:var(--s);height:var(--s);margin-left:calc(var(--s) / -2);border-radius:50%;background:var(--c);
  box-shadow:inset -4px -3px 0 rgba(0,0,0,.35),0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.core{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;transform:rotate(45deg);border-radius:6px;
  background:linear-gradient(135deg,#bfffee,#35f0cf 45%,#1a9e8c);box-shadow:0 0 30px #35f0cf,0 0 70px rgba(53,240,207,.45);animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 18px #35f0cf,0 0 40px rgba(53,240,207,.3)}}
.sp-title{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,46px);line-height:1.05;text-wrap:balance}
.sp-title i{font-style:normal;color:var(--mint)}
.sp-tag{margin:0;color:var(--mute);font-size:16px;line-height:1.45;max-width:40ch}
.sp-load{width:min(340px,100%);display:flex;flex-direction:column;gap:8px}
.sp-bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.sp-bar i{display:block;height:100%;width:6%;border-radius:999px;background:linear-gradient(90deg,var(--mint),#7cc8ff);transition:width .5s ease}
.sp-stage{font-size:13px;color:var(--mute);letter-spacing:.03em;min-height:1.2em}
.sp-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sp-btns .btn{padding:12px 22px;font-size:16px}
.sp-btns .btn.go{flex:0 1 auto;min-width:180px}
@media (prefers-reduced-motion:reduce){.orbit,.core{animation:none}}

/* ---- How to play ---- */
.helpbtn{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.card.help{width:min(720px,100%);max-height:calc(100dvh - 32px);overflow:auto;text-align:left;gap:14px}
.card.help h3{text-align:left;outline:none}
.steps{list-style:none;margin:0;padding:0;display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.step h4{margin:0;display:flex;align-items:center;gap:8px;font-size:15px}
.step h4 b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--mint);color:#04241c;font-size:13px;flex:none}
.step p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.demo{--ws:#161b34;background:var(--ws);border-radius:10px;padding:10px 12px 14px;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;overflow:hidden}
.demo .blk{font-size:13.5px;min-height:34px;padding:6px 10px;min-width:0}
.demo .blk .ico{width:20px;height:20px;font-size:13px}
.demo .chead{min-height:34px;padding:6px 10px;min-width:150px}
.demo .cbody{min-height:16px}
.demo .cfoot{height:14px;min-width:100px}
.demo .tools button{width:24px;height:22px;font-size:12px}
.planet-route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.planet-route span{display:inline-flex;align-items:center;gap:6px;background:var(--ws);border-radius:999px;padding:3px 9px 3px 4px}
.planet-route span i{width:13px;height:13px;border-radius:50%;background:var(--c)}
.card.help .row{justify-content:flex-end}
#help{z-index:110}

/* ================= PHONES ================= */
/* Phone, portrait: compact header (planets + language + help, then levels), collapsible hint, two-row run bar */
@media (max-width:699px) and (orientation:portrait){
  .top{gap:6px;padding-block:6px;flex-wrap:nowrap}
  .brand{display:none}
  .planets{flex:1 1 0}

const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // N E S W
const DIR_IDX = { N: 0, E: 1, S: 2, W: 3 };

function parseMap(level) {
  const rows = level.map, h = rows.length, w = Math.max(...rows.map(r => r.length));
  const cells = [], crystals = []; let start = null, ordered = false;
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      let ch = rows[y][x] ?? " ";
      if (ch === "S") { start = { x, y }; ch = "."; }
      else if (ch === "c") { crystals.push({ x, y, n: 0 }); ch = "."; }
      else if (/[1-9]/.test(ch)) { crystals.push({ x, y, n: +ch }); ordered = true; ch = "."; }
      row.push(ch);
    }
    cells.push(row);
  }
  return { w, h, cells, start, dir: DIR_IDX[level.dir || "N"], crystals, ordered };
}

let _bid = 1;
const newId = () => "b" + (_bid++);
function makeBlock(t, n) {
  const b = { id: newId(), t };
  if (t === "rep") { b.n = n || 3; b.body = []; }
  return b;
}
// compact notation: "f","l","r","c", ["rep", n, [...]]
function fromCompact(list) {
  return list.map(it => {
    if (Array.isArray(it)) { const b = makeBlock("rep", it[1]); b.body = fromCompact(it[2]); return b; }
    return makeBlock({ f: "fwd", l: "left", r: "right", c: "call" }[it]);
  });
}
function countBlocks(list) {
  let n = 0;
  for (const b of list) { n++; if (b.body) n += countBlocks(b.body); }
  return n;
}
function countType(list, t) {
  let n = 0;
  for (const b of list) { if (b.t === t) n++; if (b.body) n += countType(b.body, t); }
  return n;
}

function* execute(prog, list, active) {
  for (const b of list) {
    const act = active.concat(b.id);
    if (b.t === "rep") {
      for (let i = 0; i < b.n; i++) yield* execute(prog, b.body, act);
    } else if (b.t === "call") {
      yield { op: "call", active: act };
      yield* execute(prog, prog.fn, act.concat("fn-hat"));
    } else {
      yield { op: b.t, active: act };
    }
  }
}

// Stateful runner: next() → one event, or null when the program ends.
class Runner {
  constructor(level, prog) {
    this.m = parseMap(level);
    this.x = this.m.start.x; this.y = this.m.start.y; this.d = this.m.dir;
    this.got = new Set(); this.nextN = 1; this.steps = 0;
    this.it = execute(prog, prog.main, []);
    this.done = false; this.result = null;
  }
  cell(x, y) {
    if (y < 0 || y >= this.m.h || x < 0 || x >= this.m.w) return " ";
    return this.m.cells[y][x];
  }
  finish(result) { this.done = true; this.result = result; return result; }
  next() {
    if (this.done) return null;
    const r = this.it.next();
    if (r.done) {
      const total = this.m.crystals.length;
      return { op: "end", ...this.finish({ ok: false, reason: "unfinished", got: this.got.size, total }) };
    }
    if (++this.steps > 400) return { op: "end", ...this.finish({ ok: false, reason: "too_long" }) };
    const ev = { ...r.value, from: { x: this.x, y: this.y, d: this.d } };
    if (ev.op === "left") this.d = (this.d + 3) % 4;
    else if (ev.op === "right") this.d = (this.d + 1) % 4;
    else if (ev.op === "fwd") {
      const nx = this.x + DIRS[this.d][0], ny = this.y + DIRS[this.d][1], c = this.cell(nx, ny);
      if (c !== ".") {
        ev.bump = c === "#" ? "rock" : c === "~" ? "pool" : "edge";
        Object.assign(ev, this.finish({ ok: false, reason: ev.bump }));
        return ev;
      }
      this.x = nx; this.y = ny;
      const ci = this.m.crystals.findIndex(k => k.x === nx && k.y === ny);
      if (ci >= 0 && !this.got.has(ci)) {
        const k = this.m.crystals[ci];
        if (this.m.ordered && k.n !== this.nextN) {
          ev.wrongOrder = true;
          Object.assign(ev, this.finish({ ok: false, reason: "order", need: this.nextN, found: k.n }));
        } else {
          this.got.add(ci); this.nextN++; ev.collect = ci;
          if (this.got.size === this.m.crystals.length) Object.assign(ev, this.finish({ ok: true }));
        }
      }
    }
    ev.to = { x: this.x, y: this.y, d: this.d };
    return ev;
  }
}

// ================= STATE =================
const state = { levelIdx: 0, progs: {}, cursor: { list: "main", idx: 0 }, sel: null, running: false, speed: 1, done: new Set(), errId: null };
try { JSON.parse(localStorage.getItem("xr-progress") || "[]").forEach(id => state.done.add(id)); } catch (e) {}
const saveProgress = () => { try { localStorage.setItem("xr-progress", JSON.stringify([...state.done])); } catch (e) {} };
const level = () => LEVELS[state.levelIdx];
const freshProg = L => L.preset ? { main: fromCompact(L.preset.main), fn: fromCompact(L.preset.fn) } : { main: [], fn: [] };
function prog() { const L = level(); return state.progs[L.id] || (state.progs[L.id] = freshProg(L)); }
const hasFn = () => level().blocks.includes("fn");

function locate(id) {
  const walk = (list, key) => {
    for (let i = 0; i < list.length; i++) {
      const b = list[i];
      if (b.id === id) return { b, list, idx: i, key };
      if (b.body) { const r = walk(b.body, b.id); if (r) return r; }
    }
    return null;
  };
  return walk(prog().main, "main") || walk(prog().fn, "fn");
}
function getList(key) { if (key === "main") return prog().main; if (key === "fn") return prog().fn; const l = locate(key); return l ? l.b.body : null; }
function rootOf(key) { while (key !== "main" && key !== "fn") { const l = locate(key); if (!l) return "main"; key = l.key; } return key; }
function isWithin(key, id) { // is list `key` the body of block `id` or nested deeper inside it
  while (key !== "main" && key !== "fn") { if (key === id) return true; const l = locate(key); if (!l) return false; key = l.key; }
  return false;
}
const totalBlocks = () => countBlocks(prog().main) + (hasFn() ? countBlocks(prog().fn) : 0);
function addCheck(type, key) {
  const L = level();
  if (L.limit && totalBlocks() >= L.limit) return tr("limitHit");
  if (type === "call" && rootOf(key) === "fn") return tr("selfCall");
  return null;
}

// ---------- camera ----------
let camAnim = null;
function frameCamera(intro) {
  if (!mapInfo) return;
  const w = host.clientWidth || 1, h = host.clientHeight || 1, aspect = w / h;
  camera.aspect = aspect; camera.updateProjectionMatrix();
  const r = Math.hypot(SW, SD) / 2;
  const vfov = THREE.MathUtils.degToRad(camera.fov) / 2, hfov = Math.atan(Math.tan(vfov) * aspect);
  const dist = r / Math.sin(Math.min(vfov, hfov)) * .9;
  controls.target.set(0, -.25, 0);
  const to = controls.target.clone().add(CAM_DIR.clone().multiplyScalar(dist));
  controls.minDistance = dist * .45; controls.maxDistance = dist * 1.6;
  if (intro) {
    const from = controls.target.clone().add(CAM_DIR.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -.9).setY(.95).normalize().multiplyScalar(dist * 1.8));
    camAnim = { t: 0, dur: 1.9, from, to }; camera.position.copy(from); controls.enabled = false;
  } else if (!camAnim) camera.position.copy(to);
  else camAnim.to = to;
  controls.update();
}

async function animateEvent(ev) {
  const sp = state.speed;
  if (ev.op === "fwd") {
    const a = cellPos(ev.from.x, ev.from.y);
    if (ev.bump) {
      setAnim("Walk");
      const dir = new THREE.Vector3(Math.sin(heroAngle), 0, Math.cos(heroAngle));
      await tween(.45 / sp, k => { hero.position.copy(a).addScaledVector(dir, Math.sin(k * Math.PI) * .32); });
      emit(a.clone().addScaledVector(dir, .45).add(new THREE.Vector3(0, .35, 0)), "#ff6b6b", 14, 1.4, .5, -2);
      setAnim("Idle"); return;
    }
    const b = cellPos(ev.to.x, ev.to.y);
    setAnim("Walk"); footDecal(a);
    await tween(.55 / sp, k => hero.position.lerpVectors(a, b, k));
    emit(b.clone().add(new THREE.Vector3(0, .05, 0)), curTheme.dust, 5, .5, .5, -.4);
    if (ev.collect != null) collectFx(ev.collect);
    if (ev.wrongOrder) {
      setAnim("Idle");
      const c = crystalObjs[mapInfo.crystals.findIndex(k => k.x === ev.to.x && k.y === ev.to.y)];
      if (c) { emit(c.g.position.clone().add(new THREE.Vector3(0, .5, 0)), "#ff6b6b", 18, 1.2, .6, -1); await tween(.5 / sp, k => c.gem.rotation.z = Math.sin(k * Math.PI * 4) * .4); }
    }

    const from = heroAngle, to = heroAngle + (ev.op === "left" ? Math.PI / 2 : -Math.PI / 2); heroAngle = to;
    await tween(.32 / sp, k => hero.rotation.y = from + (to - from) * ease(k));
  } else if (ev.op === "call") {
    emit(hero.position.clone().add(new THREE.Vector3(0, .5, 0)), "#ff4fc3", 10, .8, .5, 0);
    await tween(.15 / sp, () => {});
  }
}
function collectFx(i) {

const factFor = L => (LANG === "en" ? FACTS_EN : FACTS)[L.planet][LEVELS.filter(l => l.planet === L.planet).indexOf(L)] || "";

// ================= RUN =================
let runToken = 0;
const REASONS = {
  edge: () => tr("edge"),
  rock: () => tr("rock")(tr("obstacles")[THEMES[level().planet].obstacle]),
  pool: () => tr("pool"),
  too_long: () => tr("tooLong"),
};
async function run() {
  if (state.running) { stopRun(); return; }
  if (!hero) return;
  const token = ++runToken;
  flushTweens(); resetHero(); hideToast(); state.errId = null; state.sel = null; renderEditor();
  state.running = true; updateRunUI();
  const r = new Runner(level(), prog()); let last = null, ev;
  while ((ev = r.next())) {
    if (token !== runToken) return;
    if (ev.op === "end") break;
    highlight(ev.active); last = ev;
    await animateEvent(ev);
    if (token !== runToken) return;
    if (r.done) break;
    await tween(.06 / state.speed, () => {});
  }
  if (token !== runToken) return;
  state.running = false; updateRunUI(); setAnim("Idle");
  const res = r.result;
  if (res.ok) { highlight([]); win(); return; }
  const lastId = last && last.active[last.active.length - 1];
  if (res.reason === "order") { highlight([], lastId); showToast(tr("order")(res.need, res.found)); }
  else if (res.reason === "unfinished") { highlight([]); showToast(tr("unfinished")(res.got, res.total)); }
  else { highlight([], lastId); showToast(REASONS[res.reason]()); }
}
function stopRun() { runToken++; state.running = false; flushTweens(); highlight([]); resetHero(); updateRunUI(); }
function updateRunUI() {
  const b = $("#runBtn"); b.textContent = state.running ? tr("stop") : tr("run"); b.classList.toggle("stop", state.running);
  $("#workspace").style.opacity = state.running ? .92 : 1;
  $("#clearBtn").disabled = state.running;
}
function win() {
  const L = level(); state.done.add(L.id); saveProgress(); renderNav();
  fillWin();
  $("#win").hidden = false; $("#winNext").focus();
}
function fillWin() {
  const L = level(), last = state.levelIdx === LEVELS.length - 1, nextL = LEVELS[state.levelIdx + 1];
  $("#winTitle").textContent = last ? tr("allDone") : tr("winTitle");
  const blocksTxt = L.limit ? tr("of")(totalBlocks(), L.limit) : totalBlocks();
  $("#winText").textContent = tr("winText")(mapInfo.crystals.length, blocksTxt) +
    (last ? tr("winAll") : nextL.planet !== L.planet ? tr("winNextPlanet")(pName(PLANETS.find(p => p.id === nextL.planet))) : "");
  $("#winNext").textContent = last ? tr("restart") : tr("next");
  const P = PLANETS.find(p => p.id === L.planet);
  $("#winFactK").innerHTML = `<span class="orb" style="--c:${P.dot}"></span>${tr("fact")(pName(P))}`;
  $("#winFactT").textContent = factFor(L);
}
$("#winNext").onclick = () => { $("#win").hidden = true; loadLevel(state.levelIdx === LEVELS.length - 1 ? 0 : state.levelIdx + 1); };
$("#winStay").onclick = () => { $("#win").hidden = true; showToast(tr("stayToast"), true); };

$("#runBtn").onclick = run;
$("#resetBtn").onclick = () => { if (state.running) stopRun(); else { flushTweens(); resetHero(); hideToast(); highlight([]); state.errId = null; renderEditor(); } };
$("#speedBtn").onclick = () => { state.speed = state.speed === 1 ? 2 : 1; $("#speedBtn").textContent = tr("speed") + state.speed; };
let clearArmed = 0;
$("#clearBtn").onclick = () => {
  const btn = $("#clearBtn");
  if (!clearArmed) { btn.textContent = tr("sure"); clearArmed = setTimeout(() => { clearArmed = 0; setClearLabel(); }, 2500); return; }
  clearTimeout(clearArmed); clearArmed = 0;
  state.progs[level().id] = freshProg(level()); state.sel = null; state.cursor = { list: "main", idx: 0 };
  setClearLabel(); changed();
};
function setClearLabel() { $("#clearBtn").textContent = level().preset ? tr("restore") : tr("clear"); }

function loadLevel(i) {
  if (state.running) stopRun();
  state.levelIdx = i; state.sel = null; state.errId = null;
  state.cursor = { list: "main", idx: prog().main.length };
  hideToast(); setClearLabel(); renderNav(); renderEditor(); buildLevel();
}

// ================= LOOP =================
const clock = new THREE.Clock();
function resize() { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; renderer.setSize(w, h); composer?.setSize(w, h); frameCamera(false); }
new ResizeObserver(resize).observe(host);
const easeOut = k => 1 - Math.pow(1 - k, 3);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .1), t = clock.elapsedTime;
  if (mixer) mixer.update(dt * (state.running ? Math.max(1, state.speed * .8) : 1));
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(k);
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
  if (camAnim) {
    camAnim.t += dt; const k = easeOut(Math.min(1, camAnim.t / camAnim.dur));
    camera.position.lerpVectors(camAnim.from, camAnim.to, k);
    if (k >= 1) { camAnim = null; controls.enabled = true; }
  }
  for (const c of crystalObjs) if (!c.collected) {
    c.gem.rotation.y += dt * 1.3; c.gem.position.y = .52 + Math.sin(t * 2 + c.phase) * .05;
    c.beam.material.opacity = .4 + Math.sin(t * 3 + c.phase) * .12;
  }
  for (const u of updaters) u(dt, t);
  for (let i = decals.length - 1; i >= 0; i--) {
    const d = decals[i]; d.life -= dt; d.m.material.opacity = Math.max(0, d.life / 3.5) * .45;
    if (d.life <= 0) { world.remove(d.m); d.m.material.dispose(); decals.splice(i, 1); }
  }
  updateParticles(dt);
  controls.update();
  if (composer) composer.render(dt); else renderer.render(scene, camera);
});


// ================= SPLASH & HELP =================
let gameReady = false, progressPct = 6, progressKey = "stEngine";
function setProgress(p, key) { progressPct = Math.max(progressPct, p); progressKey = key; $("#spBar").style.width = progressPct + "%"; $("#spStage").textContent = tr(key); }
function renderSplash() {
  $("#spTitle").innerHTML = tr("brand"); $("#spTag").textContent = tr("tagline");
  $("#spStage").textContent = tr(progressKey); $("#spHelp").textContent = tr("howTo");
  const anyDone = state.done.size > 0;
  $("#spPlay").textContent = gameReady ? (anyDone ? tr("continue") : tr("play")) : tr("loadingBtn");
  $("#spPlay").disabled = !gameReady;
}
function demoHTML(kind) {
  const blk = (type) => `<div class="blk">${simpleHTML(type)}</div>`;
  if (kind === "stack") return `<div class="demo"><div class="blk hat"><span>${tr("whenRun")}</span><span class="flag">▶</span></div>${blk("fwd")}${blk("right")}${blk("fwd")}</div>`;
  if (kind === "tools") return `<div class="demo"><div class="blk sel">${simpleHTML("left")}${toolsHTML()}</div></div>`;
  if (kind === "repeat") return `<div class="demo"><div class="blk rep ctrl"><div class="chead">${repHead(4, false)}</div><div class="cbody"><div class="list">${blk("fwd")}${blk("right")}</div></div><div class="cfoot"></div></div></div>`;
  if (kind === "route") return `<div class="planet-route">` + PLANETS.map((P, i) => `<span><i style="--c:${P.dot}"></i><b>${pName(P)}</b>&nbsp;${tr("routeText")[i]}</span>`).join("") + `</div><p>${tr("camTip")}</p>`;
  return "";
}
function renderHelp() {
  $("#helpTitle").textContent = tr("howTo"); $("#helpClose").textContent = tr("gotIt");
  $("#helpBtn").setAttribute("aria-label", tr("howTo")); $("#helpBtn").title = tr("howTo");
  $("#helpSteps").innerHTML = tr("help").map(([h, p, demo], i) =>
    `<li class="step"><h4><b>${i + 1}</b>${h}</h4>${p ? `<p>${p}</p>` : ""}${demoHTML(demo)}</li>`).join("");
}
function openHelp() { renderHelp(); $("#help").hidden = false; $("#help .card").scrollTop = 0; $("#helpTitle").focus({ preventScroll: true }); try { localStorage.setItem("xr-help-seen", "1"); } catch (e) {} }
$("#helpBtn").onclick = openHelp;
$("#spHelp").onclick = openHelp;
$("#helpClose").onclick = () => { $("#help").hidden = true; };
$("#help").addEventListener("click", e => { if (e.target.id === "help") $("#help").hidden = true; });
addEventListener("keydown", e => { if (e.key === "Escape" && !$("#help").hidden) $("#help").hidden = true; });
$("#spPlay").onclick = () => {
  $("#splash").classList.add("gone");
  if (!REDUCED) frameCamera(true);
  let seen = false; try { seen = localStorage.getItem("xr-help-seen") === "1"; } catch (e) {}
  if (!seen && state.done.size === 0) setTimeout(openHelp, 350);
};
$("#lhint").onclick = () => $("#lhint").classList.toggle("open");
const lvwrapEl = $(".lvwrap"), phonePortrait = matchMedia("(max-width:699px) and (orientation:portrait)");
function placeLevels() { (phonePortrait.matches ? $(".viewport") : $(".top")).append(lvwrapEl); }
phonePortrait.addEventListener("change", placeLevels); placeLevels();
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
applyStatic(); updateRunUI();
// start on the first unfinished level once rounded tiles are ready (or after a short wait)
let firstOpen = LEVELS.findIndex((l, i) => !state.done.has(l.id) && isUnlocked(i));
renderSplash(); setProgress(30, "stGraphics");
const wait = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
(async () => {
  await wait(Promise.all([geoReady, postReady]), 4000);
  setProgress(55, "stHero");
  await wait(heroReady, 4000);
  setProgress(78, "stLevel");
  await new Promise(r => setTimeout(r, 30));          // let the progress bar paint before the heavy build
  loadLevel(firstOpen < 0 ? 0 : firstOpen);
  $("#veil").hidden = true;
  gameReady = true; setProgress(100, "stReady"); renderSplash();
  $("#spPlay").focus();
})();
</script>
