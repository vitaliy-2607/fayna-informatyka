<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Код повернення</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; program console docks below (phone) or right (wide). Single dark "mission console" look. */
:root{
  --space:#060912;
  --glass:rgba(13,19,33,.86);
  --glass-2:rgba(22,31,52,.92);
  --line:rgba(150,180,230,.16);
  --ink:#e9eef7;
  --muted:#8e9ab0;
  --neon:#62e3ff;
  --amber:#ffb547;
  --violet:#b590ff;
  --mint:#6ee7a8;
  --pink:#ff8ac6;
  --slate:#9aa7bd;
  --danger:#ff6b81;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%;background:var(--space);color:var(--ink);overflow:hidden}
body{font-family:var(--font-ui);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;position:relative}
#stage{position:relative;min-height:0;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  #app{grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) auto}
  #panel{width:400px;border-top:0!important;border-left:1px solid var(--line);overflow:auto}
}

/* HUD */
#hud{position:absolute;inset:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(6,9,18,.85),rgba(6,9,18,0));pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.langbtn .lt{font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--neon)}
.menu-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lang{display:inline-flex;padding:3px;border-radius:10px;background:rgba(13,19,33,.8);border:1px solid var(--line)}
.lang button{padding:6px 10px;border-radius:8px;font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--neon);color:#04121a}
.hud-title{flex:1;min-width:0}
.hud-level{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em}
.hud-stage{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-stats{display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:var(--neon);box-shadow:0 0 8px var(--neon)}
.chip.pulse{animation:pulse .5s ease}
@keyframes pulse{50%{transform:scale(1.12);border-color:var(--neon)}}

/* toast */
#toast{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:14px;z-index:4;
  display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--glass-2);border:1px solid rgba(98,227,255,.35);
  box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:560px;margin:0 auto}
#toast p{margin:0;flex:1;line-height:1.45;font-size:13.5px}
#toast b{color:var(--neon)}
#toast button{padding:8px 12px;border-radius:10px;background:rgba(98,227,255,.14);color:var(--neon);font-weight:700;white-space:nowrap}

/* Panel */
#panel{background:var(--glass);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;z-index:2}
#rows{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:12px;border:1px solid transparent;transition:border-color .2s,background .2s}
.prow.active{border-color:rgba(98,227,255,.45);background:rgba(98,227,255,.06)}
.prow.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.plabel{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px}
.plabel b{font-family:var(--font-display);font-size:12px;letter-spacing:.04em}
.plabel span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.slots{display:flex;flex-wrap:wrap;gap:5px;flex:1;min-width:0}
.slot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1.5px dashed rgba(150,180,230,.22);position:relative}
.slot.filled{border-style:solid;border-color:transparent;background:var(--c);color:#0b1020}
.slot.filled svg{width:20px;height:20px}
.slot.exec{box-shadow:0 0 0 2px #fff,0 0 16px var(--c)}
.slot .fn{font-family:var(--font-display);font-weight:700;font-size:12px}
#palette{display:flex;gap:6px;flex-wrap:wrap}
.cmd{flex:1 1 40px;min-width:40px;max-width:64px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);
  color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);transition:transform .1s}
.cmd:active{transform:scale(.94)}
.cmd svg{width:22px;height:22px}
.cmd .fn{font-family:var(--font-display);font-weight:700;font-size:14px}
.cmd:disabled{opacity:.28;cursor:not-allowed}
.actions{display:flex;gap:8px}
.ghost{padding:0 12px;height:44px;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:13px}
.primary{height:44px;padding:0 18px;border-radius:12px;background:var(--neon);color:#04121a;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 0 24px rgba(98,227,255,.35)}
.primary.stop{background:var(--danger);box-shadow:0 0 24px rgba(255,107,129,.35);color:#1a0509}
#btnRun{flex:1}
.primary svg{width:16px;height:16px}

/* Menu */
#menu{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;pointer-events:none;
  background:linear-gradient(0deg,rgba(6,9,18,.96) 0%,rgba(6,9,18,.6) 45%,rgba(6,9,18,0) 70%)}
.menu-sheet{pointer-events:auto;width:100%;max-height:72%;overflow:auto;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  #menu{align-items:stretch;background:linear-gradient(90deg,rgba(6,9,18,.97) 0%,rgba(6,9,18,.75) 440px,rgba(6,9,18,0) 720px)}
  .menu-sheet{width:470px;max-height:none;padding-block:44px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:24px;justify-content:center}
}
.eyebrow{margin:0;color:var(--neon);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(28px,7vw,44px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--neon);text-shadow:0 0 22px rgba(98,227,255,.5)}
.lede{margin:0;color:#c3cbda;line-height:1.55;max-width:58ch;font-size:14.5px}
.progress{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:8px;border-radius:99px;background:rgba(150,180,230,.12);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),#a7f3ff);box-shadow:0 0 12px var(--neon);transition:width .6s}
#ptext{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
#ptext b{color:var(--ink)}
.big{height:52px;font-size:15px;width:100%}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stab{padding:8px 4px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(13,19,33,.6)}
.stab b{font-family:var(--font-display);font-size:13px}
.stab span{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stab.on{border-color:var(--neon);background:rgba(98,227,255,.08)}
.stab .mini{width:100%;height:3px;border-radius:9px;background:rgba(150,180,230,.14);overflow:hidden}
.stab .mini i{display:block;height:100%;background:var(--neon)}
.stageinfo{padding:12px 14px;border-radius:var(--r);background:rgba(13,19,33,.7);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;line-height:1.45}
.stageinfo h2{margin:0;font-family:var(--font-display);font-size:15px;font-weight:500}
.stageinfo p{margin:0;font-size:13px;color:#c3cbda}
.stageinfo .k{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.lv{height:48px;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(13,19,33,.7);font-weight:800;font-variant-numeric:tabular-nums}
.lv .st{display:flex;gap:2px}
.lv .st i{width:5px;height:5px;border-radius:50%;background:rgba(150,180,230,.2)}
.lv .st i.on{background:var(--amber);box-shadow:0 0 5px var(--amber)}
.lv.done{border-color:rgba(98,227,255,.35)}
.lv.next{background:var(--neon);color:#04121a;border-color:var(--neon);box-shadow:0 0 16px rgba(98,227,255,.4)}
.lv.next .st i{background:rgba(4,18,26,.3)}
.lv.locked{opacity:.35;cursor:not-allowed}
.lv.boss{border-style:dashed}
.menu-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.linkbtn{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:12px;padding:6px 0}

/* Modal */
#modal{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(3,6,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{width:100%;max-width:420px;background:var(--glass-2);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;text-wrap:balance}
.card p{margin:0;color:#c3cbda;line-height:1.5}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row>*{flex:1}
.stars{display:flex;gap:8px}
.stars svg{width:34px;height:34px}
.partline{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(98,227,255,.08);border:1px solid rgba(98,227,255,.25)}
.partline i{width:10px;height:10px;transform:rotate(45deg);background:var(--neon);box-shadow:0 0 10px var(--neon);flex:none}
.reward{padding:12px 14px;border-radius:12px;background:rgba(255,181,71,.1);border:1px solid rgba(255,181,71,.35);color:#ffe2b0;line-height:1.5}
.reward b{color:var(--amber);display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.fact{padding:12px 14px;border-radius:12px;background:rgba(98,227,255,.07);border:1px solid rgba(98,227,255,.22);line-height:1.5;color:#d6e3f2}
.fact b{color:var(--neon);display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.stat{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

#bigText{position:absolute;inset:0;display:grid;place-items:center;z-index:6;pointer-events:none;font-family:var(--font-display);font-weight:700;
  font-size:clamp(64px,22vw,180px);color:#fff;text-shadow:0 0 40px var(--neon)}
#caption{position:absolute;z-index:6;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(92%,460px);text-align:center;
  padding:12px 16px;border-radius:16px;background:var(--glass-2);border:1px solid rgba(98,227,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:4px}
#caption b{font-family:var(--font-display);font-weight:500;font-size:13px;color:var(--neon);letter-spacing:.02em}
#caption span{font-size:16px;font-weight:700;line-height:1.35;text-wrap:balance}
.replay{align-self:flex-start;margin-top:4px;padding:8px 12px;border-radius:10px;background:rgba(98,227,255,.12);color:var(--neon);font-weight:700;font-size:13px}
#loading{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:var(--space);text-align:center;padding-inline:24px}
#loading p{color:var(--muted);margin:10px 0 0}
#loading h2{margin:0;font-family:var(--font-display);font-size:22px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(98,227,255,.2);border-top-color:var(--neon);margin:0 auto 16px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Phone held sideways: 3D on the left, a compact program column on the right, everything sized to fit without scrolling */
@media (orientation:landscape) and (max-height:560px){
  #app{grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) auto}
  #panel{width:clamp(250px,40vw,330px);border-top:0;border-left:1px solid var(--line);overflow-y:auto;gap:6px;justify-content:center;
    padding-block:calc(6px + env(safe-area-inset-top,0px)) calc(6px + env(safe-area-inset-bottom,0px));padding-left:10px;padding-right:max(10px,env(safe-area-inset-right,0px))}
  #rows{gap:3px}
  .prow{padding:3px;gap:6px;border-radius:10px}
  .plabel{width:30px;padding-top:2px}
  .plabel b{font-size:10.5px}.plabel span{font-size:10px}
  .slots{gap:4px}
  .slot{width:30px;height:30px;border-radius:8px}
  .slot.filled svg{width:16px;height:16px}.slot .fn{font-size:10px}
  #palette{gap:4px;flex-wrap:nowrap}
  .cmd{min-width:0;flex:1 1 0;height:36px;border-radius:9px}
  .cmd svg{width:18px;height:18px}.cmd .fn{font-size:11px}
  .actions{gap:5px}
  .ghost{height:36px;padding:0 9px;font-size:12px;border-radius:9px}
  .primary{height:36px;padding:0 12px;font-size:13px;border-radius:9px}
  #hud{padding:6px 10px 6px max(10px,env(safe-area-inset-left,0px));gap:6px}
  .iconbtn{width:32px;height:32px;border-radius:9px}.iconbtn svg{width:16px;height:16px}
  .hud-level{font-size:14px}.hud-stage{font-size:10.5px}
  .chip{padding:4px 8px;font-size:11px;gap:4px}
  .hud-stats{gap:4px}
  #toast{left:max(10px,env(safe-area-inset-left,0px));right:10px;bottom:8px;padding:8px 10px;gap:8px;border-radius:12px;max-width:none}
  #toast p{font-size:12px;line-height:1.35}#toast button{padding:6px 9px;font-size:12px}
  #menu{align-items:stretch;background:linear-gradient(90deg,rgba(6,9,18,.97) 0%,rgba(6,9,18,.82) 50%,rgba(6,9,18,0) 75%)}
  .menu-sheet{width:min(56vw,440px);max-height:none;height:100%;gap:9px;
    padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
  h1{font-size:26px}.lede{font-size:12.5px;line-height:1.45}.eyebrow{font-size:10px}
  .big{height:40px;font-size:13.5px}
  .stab{padding:5px 2px}.stab b{font-size:11px}.stab span{font-size:9.5px}
  .stageinfo{padding:8px 10px;gap:4px}.stageinfo h2{font-size:13px}.stageinfo p{font-size:11.5px}
  .levels{grid-template-columns:repeat(10,1fr);gap:4px}
  .lv{height:34px;border-radius:8px;font-size:11px;gap:2px}.lv .st i{width:4px;height:4px}
  .menu-foot{font-size:10.5px}
  #modal{padding-block:8px}
  .card{max-width:min(560px,92vw);max-height:calc(100% - 16px);overflow:auto;padding:14px 16px;gap:8px;border-radius:16px}
  .card h2{font-size:18px}.card p,.fact,.reward,.partline{font-size:12.5px;line-height:1.4}
  .fact,.reward,.partline{padding:8px 10px}
  .stars svg{width:24px;height:24px}
  .card .row>*{height:38px}
  #caption{top:calc(8px + env(safe-area-inset-top,0px));padding:8px 12px}#caption span{font-size:13px}#caption b{font-size:11px}
  #bigText{font-size:clamp(48px,26vh,140px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>

<div id="app">
  <div id="stage">
    <div id="hud" hidden>
      <button id="btnMenu" class="iconbtn" data-i18n-aria="menuAria" aria-label="До меню рівнів"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
      <div class="hud-title"><div class="hud-level" id="hudLevel">Рівень 1</div><div class="hud-stage" id="hudStage"></div></div>

    </div>
    <div id="toast" hidden><p id="toastText"></p><button id="toastClose" data-i18n="gotIt">Зрозуміло</button></div>

  </div>

    <div id="palette"></div>

      <button id="btnSpeed" class="ghost">×1</button>
      <button id="btnRun" class="primary"></button>
    </div>
  </section>
  <div id="menu" hidden>
    <div class="menu-sheet">
      <div class="menu-top"><p class="eyebrow" data-i18n="eyebrow">Море Спокою · Позивний Інженер-01</p><div class="lang" role="group" data-i18n-aria="langAria" aria-label="Мова гри"><button data-lang="uk">УКР</button><button data-lang="en">ENG</button></div></div>
      <h1 data-i18n-html="h1">Код <em>повернення</em></h1>
      <p class="lede" data-i18n="lede">Космонавт застряг на Місяці. Програмуй його маршрут, збери 100 деталей нової ракети й поверни його на Землю.</p>

/* ---------------- tweens & fx ---------------- */
const tweens = []; const fx = [];
const ease = { io: t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2, out: t => 1 - (1 - t) ** 3, in: t => t * t * t, lin: t => t };

function clearTweens() { while (tweens.length) { const tw = tweens.pop(); tw.res(); } }
const wait = s => tween(s, () => { });
function burst(pos, color = 0x62e3ff, n = 34, spread = 2.2, size = .14) {
  const g = new THREE.BufferGeometry(), p = new Float32Array(n * 3), v = [];
  for (let i = 0; i < n; i++) { p.set([pos.x, pos.y, pos.z], i * 3); const d = new THREE.Vector3(Math.random() - .5, Math.random() * .9 + .1, Math.random() - .5).normalize().multiplyScalar(spread * (.4 + Math.random() * .6)); v.push(d); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color, size, map: T.dot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(g, m); scene.add(pts); let life = 0;
  fx.push(dt => { life += dt; for (let i = 0; i < n; i++) { v[i].y -= dt * 1.6; p[i * 3] += v[i].x * dt; p[i * 3 + 1] += v[i].y * dt; p[i * 3 + 2] += v[i].z * dt; } g.attributes.position.needsUpdate = true; m.opacity = Math.max(0, 1 - life / 1.1); if (life > 1.1) { scene.remove(pts); g.dispose(); m.dispose(); return false; } return true; });
}

  requestAnimationFrame(() => { resizeRenderer(); frameBoard(true); });
}
function stopRunQuiet() { runId++; running = false; clearTweens(); execMark = null; }
function showMenu() {
  stopRunQuiet(); cinematic = false; screen = 'menu';
  $('hud').hidden = true; $('panel').hidden = true; $('modal').hidden = true; toast(null); $('menu').hidden = false;
  if (!level) { level = buildLevel(nextLevel()); buildBoard(); resetBoard(); }
  if (A) A.root.visible = true;
  refreshRocket();
  menuStage = Math.min(4, Math.floor((nextLevel() - 1) / 20));
  resizeRenderer();
  renderMenu();
}
function renderMenu() {
  const dc = doneCount(), nl = nextLevel();
  $('pfill').style.width = dc + '%';
  $('ptext').innerHTML = t('partsCount', dc);
  const all = dc >= 100;
  $('btnContinue').textContent = all ? t('watchLaunch') : dc ? t('cont', nl) : t('startMission');
  $('btnContinue').onclick = () => all ? (openLevel(100), setTimeout(() => { $('menu').hidden = true; launchSequence(); }, 1300)) : openLevel(nl);
  const tabs = $('stageTabs'); tabs.innerHTML = '';
  ST().forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'stab' + (i === menuStage ? ' on' : '');
    const pr = stageProgress(i);
    b.innerHTML = `<b>${i + 1}</b><span>${i * 20 + 1}–${i * 20 + 20}</span><div class="mini"><i style="width:${pr * 100}%"></i></div>`;
    b.setAttribute('aria-label', `${t('stage')} ${i + 1}: ${s.name}`);
    b.onclick = () => { menuStage = i; renderMenu(); }; tabs.appendChild(b);
  });
  const s = ST()[menuStage];
  $('stageInfo').innerHTML = `<h2>${t('stage')} ${menuStage + 1}. ${s.name}</h2><p><span class="k">${t('goal')}</span>${s.goal}</p><p><span class="k">${t('gameplay')}</span>${s.play}</p><p><span class="k">${t('reward')}</span>${s.reward}</p>${stageProgress(menuStage) >= 1 ? `<button class="replay" id="btnReplay">${t('showAssembly')}</button>` : ''}`;
  const rb = $('btnReplay'); if (rb) rb.onclick = () => replayStage(menuStage);
  const grid = $('levelGrid'); grid.innerHTML = '';
  for (let n = menuStage * 20 + 1; n <= menuStage * 20 + 20; n++) {
    const b = document.createElement('button'), d = save.done[n] || 0, open = unlocked(n);
    b.className = 'lv' + (d ? ' done' : '') + (n === nl && !d ? ' next' : '') + (!open ? ' locked' : '') + (n % 20 === 0 ? ' boss' : '');
    b.innerHTML = `${n}<span class="st">${[0, 1, 2].map(i => `<i class="${i < d ? 'on' : ''}"></i>`).join('')}</span>`;
    b.title = partName(n); b.setAttribute('aria-label', `${t('level')} ${n}: ${partName(n)}${d ? t('lvDone', d) : open ? '' : t('lvLocked')}`);
    b.disabled = !open; b.onclick = () => openLevel(n); grid.appendChild(b);
  }
}
$('btnMenu').onclick = showMenu;
$('btnRun').onclick = run;
$('btnClear').onclick = () => { if (running) return; program[activeRow] = []; saveDraft(); renderProgram(); };
$('btnSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; $('btnSpeed').textContent = '×' + speed; };
$('btnReset').onclick = () => modal(`<h2>${t('resetQ')}</h2><p>${t('resetP')}</p>`,
  [{ label: t('cancel') }, { label: t('resetBtn'), primary: true, fn: () => { save = { done: {}, drafts: {} }; persist(); resetRocket(); level = null; showMenu(); } }]);

/* ---------------- main loop ---------------- */
const clock = new THREE.Clock(); let menuAng = .6;
function loop() {
  const dt = Math.min(clock.getDelta(), .05), time = clock.elapsedTime;
  for (let i = tweens.length - 1; i >= 0; i--) { const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); tw.fn(tw.e(k)); if (k >= 1) { tweens.splice(i, 1); tw.res(); } }
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i](dt)) fx.splice(i, 1);
  if (A) animateAstronaut(A, dt, time);
  for (const pk of pickups.values()) { pk.item.rotation.y += dt * 1.4; if (pk.g.visible && pk.item.scale.x === 1) pk.item.position.y = .55 + Math.sin(time * 2 + pk.phase) * .06; pk.ring.scale.setScalar(1 + Math.sin(time * 3 + pk.phase) * .05); }
  holoMats.forEach(m => m.uniforms.uTime.value = time);
  ROCKET.flames.forEach(f => { f.material.uniforms.uTime.value = time; });
  for (const rec of tiles.values()) { if (rec.beamMat) rec.beamMat.uniforms.uTime.value = time; if (rec.emit) rec.emit.rotation.y += dt * 2; }
  for (const st of ROCKET.stages) if (st.ring.visible) st.ring.material.emissiveIntensity = 2 + Math.sin(time * 4);
  SKY.clouds.rotation.y += dt * .004; SKY.ball.rotation.y += dt * .002;
  if (chevron && chevron.visible) chevron.position.y += Math.sin(time * 4) * .0015;
  if (screen === 'menu' && !cinematic) {
    menuAng += dt * (reduceMotion ? .01 : .06);
    const rp = ROCKET.root.position, R = 11;
    const goal = new THREE.Vector3(rp.x + Math.sin(menuAng) * R, 3.4, rp.z + Math.cos(menuAng) * R);
    camera.position.lerp(goal, Math.min(1, dt * 1.5)); controls.target.lerp(new THREE.Vector3(rp.x + 2, 2.2, rp.z + 1), Math.min(1, dt * 1.5)); camera.lookAt(controls.target);
  } else if (controls.enabled && !cinematic) controls.update();
  composer.render(dt);
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
async function boot(data) {
  await new Promise(r => setTimeout(r, 30));
  buildMaterials(); buildSharedGeos();
  SKY = buildSky(); buildTerrain(); ROCKET = buildRocket(); A = buildAstronaut(); scene.add(A.root);
  A.root.traverse(o => { if (o.isMesh) { o.castShadow = o.material !== AM.glow; } });
  resize();
  $('loading').hidden = true;
  if (data && data.n && unlocked(data.n)) { openLevel(data.n); if (data.program) { program = data.program; renderProgram(); } }
  else showMenu();
  camera.position.set(ROCKET_POS.x + 9, 4, ROCKET_POS.z + 9); controls.target.copy(ROCKET_POS);
  loop();
}
window.claude?.hot?.snapshot?.(() => ({ n: screen === 'game' && level ? level.n : null, program }));
const start = d => boot(d).catch(e => { $('loadMsg').textContent = t('bootFail') + e.message; $('loading').hidden = false; console.error(e); });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
